name: deploy

# Builds the site and publishes it to GitHub Pages.
#
# VITE_BASE is the switch between the two homes of this site. Leave it as the
# project subpath while the site lives at tobias-v-knight.github.io. Change it
# to '/' on the same commit that adds public/CNAME, and not before.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /t-portfolio-website/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Client side routing on Pages: a refresh on /projects/gravl asks the
      # server for a file that does not exist. Pages serves 404.html for that,
      # so 404.html has to be the app. Without this every deep link breaks on
      # reload, which is exactly the link a recruiter was sent.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
