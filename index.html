<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Tobias Knight</title>
    <meta name="description" content="Technical founder and builder. Applied AI, construction software, and a number of side projects that got out of hand." />

    <!-- The link preview card is the actual front door. Almost nobody arrives
         at the homepage cold: they see this card on LinkedIn first, and a bare
         grey preview means the site behind it never gets clicked. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tobiasknight.dev/" />
    <meta property="og:title" content="Tobias Knight" />
    <meta property="og:description" content="Technical founder and builder. Applied AI, construction software, and a number of side projects that got out of hand." />
    <meta property="og:image" content="https://tobiasknight.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
